name: 'Delete stale branches'
description: 'Notify authors of old branches and auto delete if no action is taken'
branding:
  icon: 'delete'
  color: 'green'
outputs:
  deleted-branches:
    description: "List of all deleted branches"
    value: ${{ steps.deleted-branches.outputs.deleted-branches }}
inputs:
  gh-repo:
    description: 'GitHub repository in the format owner/repo.'
    required: true
    default: ''
  gh-token:
    description: 'GitHub token with repo permissions.'
    required: true
    default: ''
  sender:
    description: 'Email address of the sender.'
    required: true
    default: ''
  password:
    description: 'Password for the sender email.'
    required: true
    default: ''
  days-to-notify:
    description: "Number of minimum days to send slack notification"
    required: true
    default: "60"
  days-to-delete:
    description: "Number of minimum days to delete branch"
    required: true
    default: "75"
  default-branch:
    description: 'Default branch name.'
    required: true
    default: 'develop'
  branches-to-be-ignored:
    description: 'A comma-separated list of branches to be ignored.'
    required: false
    default: '^(release\/.+|develop|main)$'
  branches-filter-regex:
    description: 'An optional Regex that will be used to filter branches from this action.'
    required: false
    default: '^feature\/.+$'
  dry-run:
    description: 'If this is enabled, the action will not delete or tag any branches.'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9' 
    - name: Install Python and Run Script
      working-directory: "${{ github.action_path }}"
      shell: bash
      run: |
        pip install pipenv
        pipenv install Pipfile
    - name: Triage branches
      id: deleted-branches
      working-directory: "${{ github.action_path }}"
      run: |
        output=$(pipenv run python3 src/purge_branches.py \
          --gh-repo "${{ inputs.gh-repo }}" \
          --gh-token "${{ inputs.gh-token }}" \
          --sender "${{ inputs.sender }}" \
          --password "${{ inputs.password }}" \
          --days-notify "${{ inputs.days-to-notify }}" \
          --days-delete "${{ inputs.days-to-delete }}" \
          --default-branch "${{ inputs.default-branch }}" \
          --branches-to-be-ignored "${{ inputs.branches-to-be-ignored }}" \
          --branches-filter-regex "${{ inputs.branches-filter-regex }}" \
          --dry-run "${{ inputs.dry-run }}" )
        echo "deleted-branches=$output" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Print deleted branches
      run: echo "Print deleted branches -- ${{ steps.deleted-branches.outputs.deleted-branches }}"
      shell: bash
